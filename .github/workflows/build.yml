
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto (descomprime el zip si está subido sin descomprimir)
        run: |
          if ls ./*.zip >/dev/null 2>&1; then
            ZIP=$(ls ./*.zip | head -n 1)
            mkdir -p proyecto
            unzip -q -o "$ZIP" -d proyecto
            echo "DIR=proyecto" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LibroDeGastos-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
